name: macOS Build

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Apple Silicon GitHub-hosted runner label
        required: true
        default: macos-14
        type: choice
        options:
          - macos-14
          - macos-15
          - macos-latest

env:
  BUILD_TYPE: Release
  CMAKE_OSX_ARCHITECTURES: arm64
  CMAKE_OSX_DEPLOYMENT_TARGET: "11.0"
  PLATFORM: arm64-apple-darwin
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg_tool
  VCPKG_COMMIT: 197fa8bf282e537136e4cf196af167e7f79be07b
  VCPKG_TRIPLET: arm64-osx-cpdn

jobs:
  macos_build:
    runs-on: ${{ inputs.runner }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore vcpkg cache
        id: restore-vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ${{ github.workspace }}/vcpkg_installed
          key: macos-vcpkg-${{ inputs.runner }}-${{ env.VCPKG_TRIPLET }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg/vcpkg.json', 'vcpkg/vcpkg-configuration.json', 'vcpkg/triplets/*.cmake', 'vcpkg/overlays/boinc/*', '.github/workflows/macos_build.yml') }}

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          if [ ! -d "$VCPKG_ROOT/.git" ]; then
            git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT" 2>&1 | tee logs/vcpkg_clone.log
          fi
          git -C "$VCPKG_ROOT" fetch --depth 1 origin "$VCPKG_COMMIT" 2>&1 | tee logs/vcpkg_fetch.log
          git -C "$VCPKG_ROOT" checkout "$VCPKG_COMMIT" 2>&1 | tee logs/vcpkg_checkout.log
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" 2>&1 | tee logs/vcpkg_bootstrap.log

      - name: Install BOINC via vcpkg
        shell: bash
        run: |
          set -o pipefail
          "$VCPKG_ROOT/vcpkg" install --x-manifest-root="$GITHUB_WORKSPACE/vcpkg" --triplet="$VCPKG_TRIPLET" 2>&1 | tee logs/vcpkg_install_boinc.log

      - name: Inspect installed BOINC package
        shell: bash
        run: |
          set -o pipefail
          installed_root="$GITHUB_WORKSPACE/vcpkg_installed/$VCPKG_TRIPLET"
          boinc_share_dir="$installed_root/share/boinc"
          boinc_include_dir="$installed_root/include"

          {
            echo "=== installed/share/boinc tree ==="
            if [ -d "$boinc_share_dir" ]; then
              find "$boinc_share_dir" -maxdepth 2 -type f | sort
            else
              echo "share/boinc directory not found: $boinc_share_dir"
            fi
          } | tee logs/vcpkg_boinc_share_tree.log

          {
            echo "=== include tree probe ==="
            if [ -d "$boinc_include_dir" ]; then
              find "$boinc_include_dir" -name boinc_api.h | sort
            else
              echo "include directory not found: $boinc_include_dir"
            fi
          } | tee logs/vcpkg_boinc_include_tree.log

          {
            echo "=== boinc CMake package files ==="
            if [ -d "$boinc_share_dir" ]; then
              for file in "$boinc_share_dir"/*.cmake; do
                [ -f "$file" ] || continue
                echo "----- $file -----"
                cat "$file"
              done
            fi
          } | tee logs/vcpkg_boinc_cmake_files.log

      - name: Save vcpkg cache
        if: always() && steps.restore-vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ${{ github.workspace }}/vcpkg_installed
          key: macos-vcpkg-${{ inputs.runner }}-${{ env.VCPKG_TRIPLET }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg/vcpkg.json', 'vcpkg/vcpkg-configuration.json', 'vcpkg/triplets/*.cmake', 'vcpkg/overlays/boinc/*', '.github/workflows/macos_build.yml') }}

      - name: Build cpdn_zip
        shell: bash
        run: |
          set -o pipefail
          cmake -S zip -B zip/build \
            -DCMAKE_INSTALL_PREFIX=zip/install \
            -DCMAKE_OSX_ARCHITECTURES="$CMAKE_OSX_ARCHITECTURES" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$CMAKE_OSX_DEPLOYMENT_TARGET" 2>&1 | tee logs/cpdn_zip_configure.log
          cmake --build zip/build --config "$BUILD_TYPE" --target install 2>&1 | tee logs/cpdn_zip_build.log

      - name: Configure controller
        shell: bash
        run: |
          set -o pipefail
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET" \
            -DPLATFORM="$PLATFORM" \
            -DCPDN_REQUIRE_STATIC_BOINC=OFF \
            -DCMAKE_OSX_ARCHITECTURES="$CMAKE_OSX_ARCHITECTURES" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$CMAKE_OSX_DEPLOYMENT_TARGET" \
            -DCPDN_BUILD_UNIT_TESTS=OFF \
            -DCPDN_BUILD_FUNCTIONAL_TESTS=OFF 2>&1 | tee logs/controller_configure.log

      - name: Build controller
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config "$BUILD_TYPE" 2>&1 | tee logs/controller_build.log

      - name: Upload macOS build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: macos-build-logs
          path: logs

      - name: Upload built controller
        if: success()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: macos-controller-binary
          path: build/cpdn_control_1.0.0_*apple-darwin*
