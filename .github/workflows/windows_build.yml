name: Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  BUILD_TYPE: Release
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg_tool
  VCPKG_COMMIT: 197fa8bf282e537136e4cf196af167e7f79be07b
  VCPKG_TRIPLET: x64-windows-cpdn-static
  CPDN_VCPKG_MANIFEST_DIR: ${{ github.workspace }}/vcpkg
  CPDN_VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed

jobs:
  windows_build:
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore vcpkg cache
        id: restore-vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ${{ env.CPDN_VCPKG_INSTALLED_DIR }}
          key: windows-vcpkg-windows-2022-${{ env.VCPKG_TRIPLET }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg/vcpkg.json', 'vcpkg/vcpkg-configuration.json', 'vcpkg/triplets/*.cmake', 'vcpkg/overlays/boinc/*', '.github/workflows/windows_build.yml') }}

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          if (-not (Test-Path "$env:VCPKG_ROOT\.git")) {
            git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT 2>&1 `
              | Tee-Object -FilePath logs/vcpkg_clone.log
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          git -C $env:VCPKG_ROOT fetch --depth 1 origin $env:VCPKG_COMMIT 2>&1 `
            | Tee-Object -FilePath logs/vcpkg_fetch.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git -C $env:VCPKG_ROOT checkout $env:VCPKG_COMMIT 2>&1 `
            | Tee-Object -FilePath logs/vcpkg_checkout.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" 2>&1 `
            | Tee-Object -FilePath logs/vcpkg_bootstrap.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install BOINC via vcpkg
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install --x-manifest-root="$env:CPDN_VCPKG_MANIFEST_DIR" --x-install-root="$env:CPDN_VCPKG_INSTALLED_DIR" --triplet="$env:VCPKG_TRIPLET" 2>&1 `
            | Tee-Object -FilePath logs/vcpkg_install_boinc.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save vcpkg cache
        if: always() && steps.restore-vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ${{ env.CPDN_VCPKG_INSTALLED_DIR }}
          key: windows-vcpkg-windows-2022-${{ env.VCPKG_TRIPLET }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg/vcpkg.json', 'vcpkg/vcpkg-configuration.json', 'vcpkg/triplets/*.cmake', 'vcpkg/overlays/boinc/*', '.github/workflows/windows_build.yml') }}

      - name: Inspect installed BOINC CMake package
        shell: pwsh
        run: |
          $installedRoot = Join-Path $env:CPDN_VCPKG_INSTALLED_DIR $env:VCPKG_TRIPLET
          $boincShareDir = Join-Path $installedRoot "share\boinc"
          $boincIncludeDir = Join-Path $installedRoot "include"
          $probeDir = Join-Path $env:GITHUB_WORKSPACE "logs\boinc_probe"
          New-Item -ItemType Directory -Force -Path $probeDir | Out-Null

          "=== installed/share/boinc tree ===" | Tee-Object -FilePath logs/vcpkg_boinc_share_tree.log
          if (Test-Path $boincShareDir) {
            Get-ChildItem $boincShareDir -Recurse | Select-Object FullName | Format-Table -AutoSize `
              | Tee-Object -FilePath logs/vcpkg_boinc_share_tree.log -Append
          } else {
            "share/boinc directory not found: $boincShareDir" `
              | Tee-Object -FilePath logs/vcpkg_boinc_share_tree.log -Append
          }

          "=== include tree probe ===" | Tee-Object -FilePath logs/vcpkg_boinc_include_tree.log
          if (Test-Path $boincIncludeDir) {
            Get-ChildItem $boincIncludeDir -Recurse -Filter boinc_api.h | Select-Object FullName | Format-Table -AutoSize `
              | Tee-Object -FilePath logs/vcpkg_boinc_include_tree.log -Append
          } else {
            "include directory not found: $boincIncludeDir" `
              | Tee-Object -FilePath logs/vcpkg_boinc_include_tree.log -Append
          }

          "=== boinc CMake package files ===" | Tee-Object -FilePath logs/vcpkg_boinc_cmake_files.log
          if (Test-Path $boincShareDir) {
            Get-ChildItem $boincShareDir -Filter *.cmake | ForEach-Object {
              "----- $($_.FullName) -----" | Tee-Object -FilePath logs/vcpkg_boinc_cmake_files.log -Append
              Get-Content $_.FullName | Tee-Object -FilePath logs/vcpkg_boinc_cmake_files.log -Append
            }
          }

          @'
          cmake_minimum_required(VERSION 3.16)
          project(boinc_probe LANGUAGES CXX)
          find_package(boinc CONFIG REQUIRED)
          get_target_property(boinc_inc unofficial::boinc::boinc INTERFACE_INCLUDE_DIRECTORIES)
          get_target_property(boincapi_inc unofficial::boinc::boincapi INTERFACE_INCLUDE_DIRECTORIES)
          get_target_property(boinc_link_libs unofficial::boinc::boinc INTERFACE_LINK_LIBRARIES)
          get_target_property(boincapi_link_libs unofficial::boinc::boincapi INTERFACE_LINK_LIBRARIES)
          message(STATUS "probe unofficial::boinc::boinc include dirs=[${boinc_inc}]")
          message(STATUS "probe unofficial::boinc::boincapi include dirs=[${boincapi_inc}]")
          message(STATUS "probe unofficial::boinc::boinc link libs=[${boinc_link_libs}]")
          message(STATUS "probe unofficial::boinc::boincapi link libs=[${boincapi_link_libs}]")
          '@ | Set-Content -Path (Join-Path $probeDir "CMakeLists.txt")

          cmake -S $probeDir -B (Join-Path $probeDir "build") -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="$env:VCPKG_TRIPLET" `
            -DVCPKG_INSTALLED_DIR="$env:CPDN_VCPKG_INSTALLED_DIR" 2>&1 `
            | Tee-Object -FilePath logs/vcpkg_boinc_probe.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build cpdn_zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          cmake -S zip -B zip/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_INSTALL_PREFIX=zip/install 2>&1 `
            | Tee-Object -FilePath logs/cpdn_zip_configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cmake --build zip/build --config $env:BUILD_TYPE --target install 2>&1 `
            | Tee-Object -FilePath logs/cpdn_zip_build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure controller
        shell: pwsh
        run: |
          # Windows BOINC path for the porting workflow:
          # use vcpkg to provide real BOINC headers and libraries while still keeping
          # functional tests disabled. The controller continues to use the in-repo
          # cpdn_zip library rather than the BOINC boinc_zip library.
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="$env:VCPKG_TRIPLET" `
            -DVCPKG_INSTALLED_DIR="$env:CPDN_VCPKG_INSTALLED_DIR" `
            -DCPDN_BUILD_UNIT_TESTS=ON `
            -DCPDN_BUILD_FUNCTIONAL_TESTS=OFF 2>&1 `
            | Tee-Object -FilePath logs/controller_configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Inspect generated controller project
        shell: pwsh
        run: |
          "=== BOINC lines from controller configure ===" | Tee-Object -FilePath logs/controller_boinc_inspect.log
          if (Test-Path logs/controller_configure.log) {
            $configureMatches = Select-String -Path logs/controller_configure.log -Pattern 'BOINC|boinc'
            if ($configureMatches) {
              $configureMatches | ForEach-Object { $_.Line } `
                | Tee-Object -FilePath logs/controller_boinc_inspect.log -Append
            } else {
              "No BOINC lines found in controller_configure.log" `
                | Tee-Object -FilePath logs/controller_boinc_inspect.log -Append
            }
          }

          $projectFile = Join-Path $env:GITHUB_WORKSPACE "build\cpdn_control.vcxproj"
          "=== cpdn_control.vcxproj BOINC/include lines ===" | Tee-Object -FilePath logs/controller_vcxproj_inspect.log
          if (Test-Path $projectFile) {
            $projectMatches = Select-String -Path $projectFile -Pattern 'AdditionalIncludeDirectories|vcpkg_installed|boinc'
            if ($projectMatches) {
              $projectMatches | ForEach-Object { "$($_.LineNumber): $($_.Line.Trim())" } `
                | Tee-Object -FilePath logs/controller_vcxproj_inspect.log -Append
            } else {
              "No BOINC or include lines found in $projectFile" `
                | Tee-Object -FilePath logs/controller_vcxproj_inspect.log -Append
            }
          } else {
            "$projectFile not found" | Tee-Object -FilePath logs/controller_vcxproj_inspect.log -Append
          }

      - name: Build controller
        shell: pwsh
        run: |
          cmake --build build --config $env:BUILD_TYPE 2>&1 `
            | Tee-Object -FilePath logs/controller_build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Windows unit tests
        shell: pwsh
        run: |
          ctest --test-dir build -C $env:BUILD_TYPE --output-on-failure 2>&1 `
            | Tee-Object -FilePath logs/controller_ctest.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: windows-build-logs
          path: logs
